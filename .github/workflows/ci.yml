name: Skill checks
on:
  push:
    paths:
      - '**.py'
      - 'examples/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - '**.py'
      - 'examples/**'
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Demo smoke check
        run: python3 scripts/run_batch.py --mode demo --output-dir out

